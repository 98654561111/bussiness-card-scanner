<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="名片管家 — 掃描名片、自動辨識與歸類，一手管理所有人脈" />
    <title>名片管家 · 掃描、辨識與歸類</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Crect x='14' y='18' width='36' height='24' rx='4' fill='none' stroke='white' stroke-width='3'/%3E%3Ccircle cx='24' cy='28' r='3' fill='white'/%3E%3Cpath d='M18 38l8-7 6 5 5-4 9 6' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <!-- 桌面版：深色側邊欄 -->
      <aside class="sidebar" id="sidebar"></aside>
      <div class="app-main">
        <!-- 手機版：頂欄與下方分頁列 -->
        <header class="topbar">
          <div class="topbar-inner">
            <div class="brand">
              <span class="brand-logo">名</span>
              <div class="brand-text">
                <strong>名片管家</strong>
                <small>掃描 · 辨識 · 自動歸類</small>
              </div>
            </div>
            <nav class="topnav" id="topnav"></nav>
          </div>
        </header>
        <main id="view" class="view"></main>
        <nav class="tabbar" id="tabbar"></nav>
      </div>
    </div>
    <div id="modal-root"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script>
      // 任何 JS 錯誤直接顯示在畫面上，不再安靜地空白
      window.addEventListener('error', function (e) {
        var d = document.getElementById('fatal-err')
        if (!d) {
          d = document.createElement('div')
          d.id = 'fatal-err'
          d.style.cssText =
            'position:fixed;left:12px;right:12px;bottom:14px;z-index:9999;background:#b91c1c;color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;font-family:system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3)'
          document.body.appendChild(d)
        }
        d.textContent = '程式發生錯誤：' + (e.message || '未知') + '（請重新整理，若持續發生請回報）'
      })
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
